name: Scheduled Crawl & Cloudflare Pages Deploy

on:
  schedule:
    # 每日 04:00 CST (UTC+8) = UTC 20:00 全量抓取工具索引 + 热榜 + AI资讯
    - cron: "0 20 * * *"
    # 每 2 小时第 15 分钟增量刷新全网摸鱼热榜与 AI资讯（控制月部署次数 < 500 免费额度）
    - cron: "15 */2 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Crawl mode"
        required: true
        default: "full"
        type: choice
        options:
          - full
          - hotlist

concurrency:
  group: cloudflare-deploy
  cancel-in-progress: false

jobs:
  crawl-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve run mode
        id: mode
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run_mode=${{ inputs.mode }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "schedule" ] && [ "${{ github.event.schedule }}" = "15 */2 * * *" ]; then
            echo "run_mode=hotlist" >> "$GITHUB_OUTPUT"
          else
            echo "run_mode=full" >> "$GITHUB_OUTPUT"
          fi

      - name: Run crawler (full or hotlist)
        env:
          CF_LIVE_URL: ${{ vars.CF_LIVE_URL }}
        shell: bash
        run: |
          mkdir -p web/data
          MODE="${{ steps.mode.outputs.run_mode }}"
          if [ "$MODE" = "hotlist" ] && [ -n "$CF_LIVE_URL" ]; then
            echo "Hotlist mode: fetching existing catalog.json from $CF_LIVE_URL ..."
            if curl -fsSL -m 20 "$CF_LIVE_URL/data/catalog.json" -o web/data/catalog.json && python3 -c "import json; d=json.load(open('web/data/catalog.json')); assert len(d.get('items', [])) >= 500"; then
              echo "Existing catalog.json validated; running hotlist + news refresh..."
              python3 -u crawler/fetch_all.py --hotlist-only --hotlist-output web/data/hotlist.json
              if ! python3 -u crawler/fetch_all.py --news-only --news-output web/data/news.json; then
                echo "::warning::Live news crawl failed; attempting to reuse existing news.json from $CF_LIVE_URL ..."
                curl -fsSL -m 20 "$CF_LIVE_URL/data/news.json" -o web/data/news.json
              fi
            else
              echo "::warning::Failed to reuse live catalog.json; falling back to full crawl."
              python3 -u crawler/fetch_all.py --output web/data/catalog.json --hotlist-output web/data/hotlist.json --news-output web/data/news.json
            fi
          else
            echo "Full mode: running complete multi-source crawl..."
            python3 -u crawler/fetch_all.py --output web/data/catalog.json --hotlist-output web/data/hotlist.json --news-output web/data/news.json
          fi

          if [ ! -f web/data/news.json ] && [ -n "$CF_LIVE_URL" ]; then
            echo "::warning::web/data/news.json missing after crawl; reusing from $CF_LIVE_URL ..."
            curl -fsSL -m 20 "$CF_LIVE_URL/data/news.json" -o web/data/news.json
          fi

      - name: Validate generated data files
        run: |
          python3 - <<'PY'
          import json
          with open("web/data/catalog.json", "r", encoding="utf-8") as f:
              cat = json.load(f)
          with open("web/data/hotlist.json", "r", encoding="utf-8") as f:
              hot = json.load(f)
          with open("web/data/news.json", "r", encoding="utf-8") as f:
              news = json.load(f)
          items = len(cat.get("items", []))
          plats = len(hot.get("platforms", []))
          news_items = len(news.get("items", []))
          print(f"Validated catalog.json ({items} items), hotlist.json ({plats} platforms) & news.json ({news_items} items)")
          assert items >= 500, f"Too few catalog items: {items}"
          assert plats >= 5, f"Too few hotlist platforms: {plats}"
          assert news_items >= 10, f"Too few news items: {news_items}"
          PY

      - name: Build static SEO & GEO pages (Categories, Daily Briefs, llms.txt, RSS, Sitemap)
        env:
          CF_LIVE_URL: ${{ vars.CF_LIVE_URL }}
        shell: bash
        run: |
          LIVE_BASE="${CF_LIVE_URL:-https://dlzbkj-ai.pages.dev}"
          mkdir -p web/daily
          curl -fsSL -m 15 "$LIVE_BASE/daily/history.json" -o web/daily/history.json 2>/dev/null || true
          python3 crawler/build_seo_geo.py --web-dir web --base-url "$LIVE_BASE"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Stage private ops dashboard (if configured)
        env:
          ADMIN_PATH: ${{ secrets.ADMIN_PATH }}
        shell: bash
        run: |
          if [ -n "$ADMIN_PATH" ] && [ -d admin-src ]; then
            if [[ ! "$ADMIN_PATH" =~ ^[a-zA-Z0-9_-]{8,64}$ ]]; then
              echo "::error::Invalid ADMIN_PATH format"
              exit 1
            fi
            rm -rf "web/$ADMIN_PATH"
            cp -R admin-src "web/$ADMIN_PATH"
            printf '\n/%s\n  X-Robots-Tag: noindex, nofollow\n  Cache-Control: no-store\n\n/%s/*\n  X-Robots-Tag: noindex, nofollow\n  Cache-Control: no-store\n' "$ADMIN_PATH" "$ADMIN_PATH" >> web/_headers
            echo "Private ops dashboard staged for deployment."
          else
            echo "ADMIN_PATH secret not configured; skipping private ops dashboard."
          fi

      - name: Deploy static assets to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_PAGES_PROJECT: ${{ vars.CF_PAGES_PROJECT }}
        run: |
          PROJECT="${CF_PAGES_PROJECT:-dlzbkj-ai}"
          npx --yes wrangler@latest pages deploy ./web \
            --project-name="$PROJECT" \
            --branch=main \
            --commit-dirty=true \
            --commit-message="Scheduled (${{ steps.mode.outputs.run_mode }}) sync"

      - name: Push updated URLs to IndexNow (Bing & AI Search Engines)
        env:
          CF_LIVE_URL: ${{ vars.CF_LIVE_URL }}
        shell: bash
        run: |
          LIVE_BASE="${CF_LIVE_URL:-https://dlzbkj-ai.pages.dev}"
          python3 crawler/build_seo_geo.py --web-dir web --base-url "$LIVE_BASE" --push-indexnow || true
