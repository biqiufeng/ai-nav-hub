<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <script>
    try {
      var savedScheme = localStorage.getItem("color-scheme");
      var validScheme = savedScheme === "light" || savedScheme === "dark" ? savedScheme : "light dark";
      document.querySelector('meta[name="color-scheme"]').content = validScheme;
    } catch (e) {}
  </script>
  <title>开发者实用工具箱 · AI 导航聚合站</title>
  <meta name="description" content="内置 JSON 格式化、时间戳、Base64、URL、JWT 解析、UUID、强密码、正则测试、颜色转换、哈希计算等开箱即用开发者工具箱，并聚合全网精选开发效率导航。">
  <link rel="icon" type="image/png" sizes="64x64" href="../favicon.png?v=4">
  <link rel="apple-touch-icon" sizes="180x180" href="../apple-touch-icon.png?v=4">
  <link rel="stylesheet" href="../styles.css?v=12">
  <link rel="stylesheet" href="./tools.css?v=3">
  <script type="module" src="./tools.js?v=3"></script>
</head>
<body>
  <header class="top-bar site-header" id="topBar">
    <div class="top-bar__inner">
      <div class="top-bar__left">
        <a class="brand" href="../" aria-label="AI 导航聚合站首页">
          <img class="brand__icon" src="../logo.jpg?v=4" alt="" width="28" height="28">
          <span class="brand__name">AI 导航聚合站</span>
        </a>
      </div>

      <div class="top-bar__actions">
        <nav class="site-nav" aria-label="主导航">
          <button
            class="menu-button"
            type="button"
            popovertarget="site-menu"
            popovertargetaction="toggle"
            aria-controls="site-menu"
          >
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
              <path d="M4 7h16M4 12h16M4 17h16"/>
            </svg>
            <span>频道</span>
          </button>
          <ul id="site-menu" class="site-menu" popover="auto">
            <li><a href="../">首页</a></li>
            <li><a href="./" aria-current="page">工具</a></li>
            <li><a href="../moyu/">摸鱼</a></li>
          </ul>
        </nav>

        <button class="theme-toggle" id="themeToggle" type="button" aria-label="切换浅色或深色外观" title="切换外观（可收回至跟随系统）">
          <span class="theme-toggle__icon theme-toggle__icon--sun" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="4"/>
              <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
            </svg>
          </span>
          <span class="theme-toggle__icon theme-toggle__icon--moon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>
            </svg>
          </span>
          <span class="sr-only" id="themeToggleLabel">切换外观</span>
        </button>
      </div>
    </div>
  </header>

  <main class="tools-shell">
    <section class="tools-hero">
      <h1 class="tools-hero__title">在线开发者工具箱</h1>
      <p class="tools-hero__sub">纯本地浏览器计算，数据不上传服务器；下方同步汇总全网开发与效率工具导航。</p>
    </section>

    <section class="workbench" aria-label="本地实用工具">
      <div class="tablist" role="tablist" aria-label="开发工具切换" id="toolTabs">
        <button type="button" class="tab-btn" role="tab" id="tab-json" aria-selected="true" data-tool="json">JSON 格式化</button>
        <button type="button" class="tab-btn" role="tab" id="tab-time" aria-selected="false" data-tool="time">时间戳</button>
        <button type="button" class="tab-btn" role="tab" id="tab-base64" aria-selected="false" data-tool="base64">Base64</button>
        <button type="button" class="tab-btn" role="tab" id="tab-url" aria-selected="false" data-tool="url">URL 编解码</button>
        <button type="button" class="tab-btn" role="tab" id="tab-jwt" aria-selected="false" data-tool="jwt">JWT 解析</button>
        <button type="button" class="tab-btn" role="tab" id="tab-uuid" aria-selected="false" data-tool="uuid">UUID 生成</button>
        <button type="button" class="tab-btn" role="tab" id="tab-pwd" aria-selected="false" data-tool="pwd">随机密码</button>
        <button type="button" class="tab-btn" role="tab" id="tab-regex" aria-selected="false" data-tool="regex">正则测试</button>
        <button type="button" class="tab-btn" role="tab" id="tab-text" aria-selected="false" data-tool="text">文本处理</button>
        <button type="button" class="tab-btn" role="tab" id="tab-color" aria-selected="false" data-tool="color">颜色转换</button>
        <button type="button" class="tab-btn" role="tab" id="tab-cron" aria-selected="false" data-tool="cron">Cron 速查</button>
        <button type="button" class="tab-btn" role="tab" id="tab-hash" aria-selected="false" data-tool="hash">SHA 哈希</button>
      </div>

      <div class="workbench-body" id="workbenchBody" role="tabpanel" aria-labelledby="tab-json" tabindex="0"></div>
    </section>

    <section class="dir-section" aria-labelledby="dirHeading">
      <div class="dir-head">
        <div>
          <h2 class="dir-head__title" id="dirHeading">全网开发与效率导航精选</h2>
          <p class="dir-head__sub" id="dirCount">正在加载目录…</p>
        </div>
        <div class="dir-controls">
          <div class="search-box search-box--compact" id="dirSearchBox" role="search">
            <svg class="search-box__icon" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="11" cy="11" r="8"/>
              <path d="m21 21-4.3-4.3"/>
            </svg>
            <input id="dirSearch" class="search-box__input" type="search" autocomplete="off" spellcheck="false" placeholder="筛选开发/效率/设计工具…" aria-label="筛选开发与效率工具">
            <kbd class="search-box__kbd" aria-hidden="true">/</kbd>
            <button class="search-box__clear" id="dirSearchClear" type="button" aria-label="清空搜索" hidden>
              <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
                <path d="M18 6 6 18M6 6l12 12"/>
              </svg>
            </button>
          </div>
        </div>
      </div>
      <div class="dir-cats" id="dirCats"></div>
      <div class="dir-grid" id="dirGrid"></div>
      <div class="empty-state" id="dirEmpty" hidden>
        <div class="empty-state__icon" aria-hidden="true">✦</div>
        <h3 class="empty-state__title" id="dirEmptyTitle">没有找到匹配的工具</h3>
        <p class="empty-state__desc" id="dirEmptyDesc">试试调整关键词，或恢复查看全部分类。</p>
        <button class="btn-secondary" id="dirEmptyBtn" type="button">重置筛选</button>
      </div>
      <div class="load-more-wrap" id="dirLoadMoreWrap" hidden>
        <button class="btn-secondary" id="dirLoadMoreBtn" type="button">展开更多</button>
      </div>
    </section>
  </main>

  <div class="toast-region" aria-live="polite" aria-atomic="true">
    <div class="toast" id="toast" hidden></div>
  </div>
</body>
</html>
