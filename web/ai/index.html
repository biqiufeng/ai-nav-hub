<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <script>
    try {
      var savedScheme = localStorage.getItem("color-scheme");
      var validScheme = savedScheme === "light" || savedScheme === "dark" ? savedScheme : "light dark";
      document.querySelector('meta[name="color-scheme"]').content = validScheme;
    } catch (e) {}
  </script>
  <title>AI 大模型聚合工作台 · AI 导航聚合站</title>
  <meta name="description" content="一键切换 DeepSeek、ChatGPT、Claude、Gemini、Kimi、豆包、通义千问、腾讯元宝、智谱清言等主流大模型对话入口。">
  <link rel="icon" type="image/png" sizes="64x64" href="../favicon.png?v=4">
  <link rel="apple-touch-icon" sizes="180x180" href="../apple-touch-icon.png?v=4">
  <link rel="stylesheet" href="../styles.css?v=10">
  <link rel="stylesheet" href="./ai.css?v=2">
  <script type="module" src="./ai.js?v=2"></script>
</head>
<body>
  <header class="top-bar site-header" id="topBar">
    <div class="top-bar__inner">
      <div class="top-bar__left">
        <a class="brand" href="../" aria-label="AI 导航聚合站首页">
          <img class="brand__icon" src="../logo.jpg?v=4" alt="" width="28" height="28">
          <span class="brand__name">AI 导航聚合站</span>
        </a>
      </div>

      <div class="top-bar__actions">
        <nav class="site-nav" aria-label="主导航">
          <button
            class="menu-button"
            type="button"
            popovertarget="site-menu"
            popovertargetaction="toggle"
            aria-controls="site-menu"
          >
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
              <path d="M4 7h16M4 12h16M4 17h16"/>
            </svg>
            <span>频道</span>
          </button>
          <ul id="site-menu" class="site-menu" popover="auto">
            <li><a href="../">首页</a></li>
            <li><a href="./" aria-current="page">AI</a></li>
            <li><a href="../tools/">工具</a></li>
            <li><a href="../moyu/">摸鱼</a></li>
          </ul>
        </nav>

        <button class="theme-toggle" id="themeToggle" type="button" aria-label="切换浅色或深色外观" title="切换外观（可收回至跟随系统）">
          <span class="theme-toggle__icon theme-toggle__icon--sun" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="4"/>
              <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
            </svg>
          </span>
          <span class="theme-toggle__icon theme-toggle__icon--moon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>
            </svg>
          </span>
          <span class="sr-only" id="themeToggleLabel">切换外观</span>
        </button>
      </div>
    </div>
  </header>

  <main class="ai-workspace">
    <aside class="model-dock" aria-label="大模型列表">
      <div class="model-dock__head">
        <div>
          <h1 class="model-dock__title">AI 工作台</h1>
          <p class="model-dock__sub">快速切换与自定义排序</p>
        </div>
        <button class="btn-secondary dock-reset-btn" id="resetOrderBtn" type="button" title="恢复默认顺序" hidden>重置</button>
      </div>

      <div class="search-box search-box--compact" id="modelFilterBox" role="search">
        <svg class="search-box__icon" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="11" cy="11" r="8"/>
          <path d="m21 21-4.3-4.3"/>
        </svg>
        <input
          id="modelFilter"
          class="search-box__input"
          type="search"
          autocomplete="off"
          spellcheck="false"
          placeholder="筛选模型（如 DeepSeek）"
          aria-label="筛选大模型"
        >
        <kbd class="search-box__kbd" aria-hidden="true">/</kbd>
        <button class="search-box__clear" id="modelFilterClear" type="button" aria-label="清空模型筛选" hidden>
          <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <path d="M18 6 6 18M6 6l12 12"/>
          </svg>
        </button>
      </div>

      <ul class="model-list" id="modelList"></ul>
      <div class="model-empty" id="modelEmpty" hidden>
        <p class="model-empty__text">没有匹配的模型</p>
        <button class="btn-secondary dock-reset-btn" id="modelEmptyClearBtn" type="button">清空筛选</button>
      </div>
    </aside>

    <section class="stage-panel" aria-label="对话工作区">
      <div class="stage-toolbar">
        <div class="stage-toolbar__info">
          <div class="stage-avatar" id="stageAvatar" aria-hidden="true"></div>
          <div class="stage-titles">
            <h2 class="stage-title" id="stageTitle">DeepSeek</h2>
            <p class="stage-desc" id="stageDesc">深度求索开源推理与编程大模型</p>
          </div>
        </div>
        <div class="stage-toolbar__actions">
          <button class="btn-secondary stage-btn" id="reloadFrameBtn" type="button">
            <svg class="btn-refresh-icon" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M21 12a9 9 0 1 1-2.64-6.36"/>
              <path d="M21 3v6h-6"/>
            </svg>
            <span class="btn-label">刷新</span>
          </button>
          <a class="btn-primary stage-btn" id="openNewTabBtn" href="https://chat.deepseek.com" target="_blank" rel="noopener noreferrer">
            新标签页打开
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M7 17 17 7M7 7h10v10"/>
            </svg>
          </a>
        </div>
      </div>

      <div class="stage-notice" id="stageNotice" hidden>
        若内嵌页面加载缓慢或被官网安全策略拦截，请直接点击右上角「新标签页打开」。
      </div>

      <div class="stage-frame-wrap" id="stageFrameWrap">
        <div class="stage-loading" id="stageLoading" hidden aria-live="polite">
          <div class="stage-spinner" aria-hidden="true"></div>
          <p class="stage-loading__text">正在连接对话工作区…</p>
          <a class="btn-secondary stage-btn" id="stageSlowOpenBtn" href="#" target="_blank" rel="noopener noreferrer" hidden>
            直接在新标签页打开
          </a>
        </div>

        <iframe
          id="modelFrame"
          class="stage-frame"
          title="AI 对话窗口"
          referrerpolicy="no-referrer-when-downgrade"
          sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox"
          hidden
        ></iframe>

        <div class="stage-launch" id="stageLaunch" hidden>
          <div class="stage-launch__card" id="stageLaunchCard">
            <div class="stage-launch__badge" id="launchAvatar" aria-hidden="true"></div>
            <h3 class="stage-launch__title" id="launchTitle"></h3>
            <p class="stage-launch__desc" id="launchDesc"></p>
            <p class="stage-launch__hint">出于账号登录态与隐私安全保护，该平台仅支持在官方新标签页中使用。</p>
            <a class="btn-primary" id="launchPrimaryBtn" href="#" target="_blank" rel="noopener noreferrer">
              前往官方对话窗口
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M7 17 17 7M7 7h10v10"/>
              </svg>
            </a>
          </div>
        </div>
      </div>
    </section>
  </main>

  <div class="toast-region" aria-live="polite" aria-atomic="true">
    <div class="toast" id="toast" hidden></div>
  </div>
</body>
</html>
