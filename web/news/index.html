<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <script>
    try {
      var savedScheme = localStorage.getItem("color-scheme");
      var validScheme = savedScheme === "light" || savedScheme === "dark" ? savedScheme : "light dark";
      document.querySelector('meta[name="color-scheme"]').content = validScheme;
    } catch (e) {}
  </script>
  <title>AI 资讯 · AI 导航聚合站</title>
  <meta name="description" content="实时同步前沿 AI 行业动态、大模型发布、智能体开发与多模态技术速递。">
  <link rel="icon" type="image/png" sizes="64x64" href="../favicon.png?v=5">
  <link rel="apple-touch-icon" sizes="180x180" href="../apple-touch-icon.png?v=5">
  <link rel="stylesheet" href="../styles.css?v=13">
  <link rel="stylesheet" href="./news.css?v=1">
  <script type="module" src="./news.js?v=1"></script>
</head>
<body>
  <header class="top-bar site-header" id="topBar">
    <div class="top-bar__inner">
      <div class="top-bar__left">
        <a class="brand" href="../" aria-label="AI 导航聚合站首页">
          <img class="brand__icon" src="../logo.jpg?v=5" alt="" width="28" height="28">
          <span class="brand__name">AI 导航聚合站</span>
        </a>
      </div>

      <div class="top-bar__actions">
        <nav class="site-nav" aria-label="主导航">
          <button
            class="menu-button"
            type="button"
            popovertarget="site-menu"
            popovertargetaction="toggle"
            aria-controls="site-menu"
          >
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
              <path d="M4 7h16M4 12h16M4 17h16"/>
            </svg>
            <span>频道</span>
          </button>
          <ul id="site-menu" class="site-menu" popover="auto">
            <li><a href="../">首页</a></li>
            <li><a href="./" aria-current="page">AI资讯</a></li>
            <li><a href="../moyu/">摸鱼</a></li>
          </ul>
        </nav>

        <button class="theme-toggle" id="themeToggle" type="button" aria-label="切换浅色或深色外观" title="切换外观（可收回至跟随系统）">
          <span class="theme-toggle__icon theme-toggle__icon--sun" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="4"/>
              <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
            </svg>
          </span>
          <span class="theme-toggle__icon theme-toggle__icon--moon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>
            </svg>
          </span>
          <span class="sr-only" id="themeToggleLabel">切换外观</span>
        </button>
      </div>
    </div>
  </header>

  <main class="news-shell">
    <section class="news-hero">
      <h1 class="news-hero__title">AI 资讯速递</h1>
      <div class="news-hero__controls">
        <div class="search-box search-box--compact news-search-wrap" id="newsSearchBox" role="search">
          <svg class="search-box__icon" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="11" cy="11" r="8"/>
            <path d="m21 21-4.3-4.3"/>
          </svg>
          <input id="newsSearch" class="search-box__input" type="search" autocomplete="off" spellcheck="false" placeholder="搜索 AI 资讯标题或关键词…" aria-label="搜索 AI 资讯">
          <kbd class="search-box__kbd" aria-hidden="true">/</kbd>
          <button class="search-box__clear" id="newsSearchClear" type="button" aria-label="清空资讯搜索" hidden>
            <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
              <path d="M18 6 6 18M6 6l12 12"/>
            </svg>
          </button>
        </div>
        <button id="refreshNewsBtn" class="btn-secondary news-refresh-btn" type="button">
          <svg class="btn-refresh-icon" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 12a9 9 0 1 1-2.64-6.36"/>
            <path d="M21 3v6h-6"/>
          </svg>
          <span class="btn-label">刷新资讯</span>
        </button>
      </div>
    </section>

    <div class="news-toolbar">
      <div class="news-topics" id="newsTopics" role="group" aria-label="AI 资讯主题筛选"></div>
      <span class="news-count" id="newsCount" aria-live="polite">正在加载资讯…</span>
    </div>

    <section class="news-grid" id="newsGrid" aria-label="AI 资讯列表"></section>

    <div class="empty-state" id="newsEmpty" hidden>
      <div class="empty-state__icon" aria-hidden="true">✦</div>
      <h2 class="empty-state__title" id="newsEmptyTitle">没有找到匹配的 AI 资讯</h2>
      <p class="empty-state__desc" id="newsEmptyDesc">试试换个关键词，或者切换回全部主题查看。</p>
      <button class="btn-secondary" id="newsEmptyBtn" type="button">清空筛选</button>
    </div>

    <div class="load-more-wrap" id="newsLoadMoreWrap" hidden>
      <button class="btn-secondary" id="newsLoadMoreBtn" type="button">展开更多资讯</button>
    </div>
  </main>

  <dialog class="tool-dialog news-dialog" id="newsDialog" closedby="any" aria-labelledby="newsDialogTitle">
    <div class="tool-dialog__surface news-dialog__surface">
      <div class="tool-dialog__header">
        <div class="news-dialog__head-meta">
          <div class="news-dialog__badges" id="newsDialogMeta"></div>
          <h2 class="tool-dialog__title news-dialog__title" id="newsDialogTitle"></h2>
        </div>
        <button class="icon-btn" id="newsDialogCloseBtn" type="button" aria-label="关闭资讯速览">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <path d="M18 6 6 18M6 6l12 12"/>
          </svg>
        </button>
      </div>

      <img class="news-dialog__cover" id="newsDialogCover" alt="" referrerpolicy="no-referrer" hidden>

      <div class="news-dialog__body" id="newsDialogBody"></div>

      <div class="tool-dialog__actions">
        <a class="btn-primary" id="newsDialogVisitBtn" href="#" target="_blank" rel="noopener noreferrer">
          查看完整详情
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M7 17 17 7M7 7h10v10"/>
          </svg>
        </a>
        <a class="btn-secondary" id="newsDialogSourceBtn" href="#" target="_blank" rel="noopener noreferrer" hidden>
          访问原文
        </a>
        <button class="btn-secondary" id="newsDialogCopyBtn" type="button">
          <span id="newsDialogCopyText">复制链接</span>
        </button>
      </div>
    </div>
  </dialog>

  <div class="toast-region" aria-live="polite" aria-atomic="true">
    <div class="toast" id="toast" hidden></div>
  </div>
</body>
</html>
