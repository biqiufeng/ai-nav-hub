  <script type="application/ld+json">
    {

<body>
  <header class="top-bar site-header" id="topBar">
    <div class="top-bar__inner">
      <div class="top-bar__left">
        <button class="drawer-trigger" id="drawerOpen" type="button" aria-label="打开分类目录" aria-expanded="false" aria-controls="mobileDrawer">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <path d="M4 7h16M4 12h16M4 17h12"/>
          </svg>
        </button>
        <a class="brand" href="./" aria-label="AI 导航聚合站首页">
          <img class="brand__icon" src="./logo.jpg?v=5" alt="" width="28" height="28">
          <span class="brand__name">AI 导航聚合站</span>
        </a>
      </div>

      <div class="top-bar__actions">
        <nav class="site-nav" aria-label="主导航">
          <button
            class="menu-button"
            type="button"
            popovertarget="site-menu"
            popovertargetaction="toggle"
            aria-controls="site-menu"
          >
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
              <path d="M4 7h16M4 12h16M4 17h16"/>
            </svg>
            <span>频道</span>
          </button>
          <ul id="site-menu" class="site-menu" popover="auto">
            <li><a href="./" aria-current="page">首页</a></li>
            <li><a href="./news/">AI资讯</a></li>
            <li><a href="./moyu/">热榜</a></li>
          </ul>
        </nav>

        <button class="submit-trigger" type="button" command="show-modal" commandfor="submitToolDialog">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true">
            <path d="M12 5v14M5 12h14"/>
          </svg>
          <span><span class="submit-trigger__prefix">提交</span>收录</span>
        </button>

        <button class="theme-toggle" id="themeToggle" type="button" aria-label="切换浅色或深色外观" title="切换外观（可收回至跟随系统）">
          <span class="theme-toggle__icon theme-toggle__icon--sun" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="4"/>
              <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
            </svg>
          </span>
          <span class="theme-toggle__icon theme-toggle__icon--moon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>

          <span class="sr-only" id="themeToggleLabel">切换外观</span>
        </button>
      </div>
    </div>
  </header>

  <div class="workspace-layout" id="top">
    <aside class="sidebar" id="desktopSidebar" aria-label="左侧快速选择"></aside>

    <main class="page-shell">
      <section class="hero" id="heroDock" aria-labelledby="heroTitle">
        <h1 class="sr-only" id="heroTitle">AI 导航聚合站</h1>

        <div class="controls-dock">
          <search class="search-box">
            <svg class="search-box__icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="11" cy="11" r="8"/>
              <path d="m21 21-4.3-4.3"/>
            </svg>
            <input
              id="searchInput"
              class="search-box__input"
              type="search"
              inputmode="search"
              autocomplete="off"
              spellcheck="false"
              placeholder="搜索 AI 工具、用途或分类（如 DeepSeek、编程、视频）"
              aria-label="搜索 AI 工具"
            >
            <kbd class="search-box__kbd" id="searchKbd" aria-hidden="true">/</kbd>
            <button class="search-box__clear" id="searchClear" type="button" aria-label="清空搜索" hidden>
              <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
                <path d="M18 6 6 18M6 6l12 12"/>
              </svg>
            </button>
          </search>

          <div class="controls-row">
            <div class="segmented" id="regionSegmented" role="tablist" aria-label="区域与收藏筛选">
              <div class="segmented__thumb" id="segmentedThumb" aria-hidden="true"></div>
              <button class="segmented__btn is-active" type="button" role="tab" aria-selected="true" data-region="all">
                全部 <span class="segmented__count" data-count="all">0</span>
              </button>
              <button class="segmented__btn" type="button" role="tab" aria-selected="false" data-region="hot">
                热门推荐 <span class="segmented__count" data-count="hot">0</span>
              </button>
              <button class="segmented__btn" type="button" role="tab" aria-selected="false" data-region="domestic">
                国内主流 <span class="segmented__count" data-count="domestic">0</span>
              </button>
              <button class="segmented__btn" type="button" role="tab" aria-selected="false" data-region="overseas">
                海外主流 <span class="segmented__count" data-count="overseas">0</span>
              </button>
              <button class="segmented__btn" type="button" role="tab" aria-selected="false" data-region="dev">
                开发效率 <span class="segmented__count" data-count="dev">0</span>
              </button>
              <button class="segmented__btn" type="button" role="tab" aria-selected="false" data-region="leisure">
                影音娱乐 <span class="segmented__count" data-count="leisure">0</span>
              </button>
              <button class="segmented__btn" type="button" role="tab" aria-selected="false" data-region="favorites">
                我的收藏 <span class="segmented__count" data-count="favorites">0</span>
              </button>
            </div>

            <div class="meta-actions">
              <span class="result-counter" id="resultCounter" aria-live="polite">正在加载索引…</span>
              <button class="clear-fav-btn" id="clearFavBtn" type="button" hidden>
                清空收藏
              </button>
            </div>
          </div>

          <nav class="category-bar" id="categoryBar" aria-label="工具分类"></nav>
        </div>
      </section>

      <section class="catalog-section" aria-label="工具列表">
        <div id="catalogContainer"></div>

        <div class="empty-state" id="emptyState" hidden>
          <div class="empty-state__icon" aria-hidden="true">✦</div>
          <h2 class="empty-state__title" id="emptyTitle">没有找到匹配的工具</h2>
          <p class="empty-state__desc" id="emptyDesc">试试换个关键词，或者恢复到全部分类查看。</p>
          <button class="btn-secondary" id="emptyResetBtn" type="button">显示全部工具</button>
        </div>

        <div class="load-more-wrap" id="loadMoreWrap" hidden>
          <button class="btn-secondary" id="loadMoreBtn" type="button">展开更多工具</button>
        </div>
      </section>
    </main>
  </div>

  <footer class="site-footer">
    <div class="site-footer__inner site-footer__bar">
      <p class="site-footer__copy">AI 导航聚合站 · 每日自动同步国内外主流 AI 工具、快讯与热榜 · 零广告免登录</p>
      <nav class="site-footer__links" aria-label="站点底部导航">
        <button class="footer-link-btn" type="button" command="show-modal" commandfor="submitToolDialog">免费提交工具收录</button>
        <a href="./news/">AI 资讯</a>
        <a href="./moyu/">全网热榜</a>
        <a href="./sitemap.xml">Sitemap</a>
        <a href="https://github.com/biqiufeng/ai-nav-hub" target="_blank" rel="noopener noreferrer">GitHub</a>
      </nav>
    </div>
  </footer>

  <!-- Mobile swipe-to-dismiss navigation drawer (modern-web-guidance: navigation-drawer) -->
  <dialog class="Drawer" id="mobileDrawer" aria-label="快速选择与分类目录">
    <div class="Drawer-scroller">
      <nav class="Drawer-sheet" aria-label="移动端分类菜单">
        <div class="Drawer-head">
          <span class="Drawer-head__title">快速选择</span>
          <button class="icon-btn" id="drawerClose" type="button" aria-label="关闭目录" autofocus>
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
              <path d="M18 6 6 18M6 6l12 12"/>
            </svg>
          </button>
        </div>
        <div id="mobileSidebarHost" class="Drawer-body"></div>
      </nav>
    </div>
  </dialog>

  <dialog class="tool-dialog" id="toolDialog" closedby="any" aria-labelledby="dialogTitle">
    <div class="tool-dialog__surface">
      <div class="tool-dialog__header">
        <div class="tool-dialog__identity">
          <div class="tool-avatar tool-avatar--lg" id="dialogAvatar" aria-hidden="true"></div>
          <div class="tool-dialog__titles">
            <h1 class="tool-dialog__title" id="dialogTitle"></h1>
            <p class="tool-dialog__domain" id="dialogDomain"></p>
          </div>
        </div>
        <button class="icon-btn" id="dialogCloseBtn" type="button" aria-label="关闭详情">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <path d="M18 6 6 18M6 6l12 12"/>
          </svg>
        </button>
      </div>

      <p class="tool-dialog__desc" id="dialogDesc"></p>

      <div class="tool-dialog__meta">
        <span class="meta-badge" id="dialogRegionBadge"></span>
        <span class="meta-badge" id="dialogCategoryBadge"></span>
      </div>

      <div class="tool-dialog__actions">
        <a class="btn-primary" id="dialogVisitBtn" href="#" target="_blank" rel="noopener noreferrer">
          访问官网
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M7 17 17 7M7 7h10v10"/>
          </svg>
        </a>
        <button class="btn-secondary" id="dialogCopyBtn" type="button">
          <span id="dialogCopyText">复制链接</span>
        </button>
        <button class="btn-secondary" id="dialogFavBtn" type="button">
          <span id="dialogFavText">收藏</span>
        </button>
      </div>
    </div>
  </dialog>

  <dialog class="tool-dialog submit-dialog" id="submitToolDialog" closedby="any" aria-labelledby="submitDialogTitle">
    <div class="tool-dialog__surface submit-dialog__surface">
      <div class="tool-dialog__header">
        <div class="tool-dialog__titles">
          <h1 class="tool-dialog__title" id="submitDialogTitle">免费提交 AI 工具收录</h1>
          <p class="tool-dialog__domain">零广告纯净收录 · 欢迎自荐或推荐优质 AI 产品与开源项目</p>
        </div>
        <button class="icon-btn" id="submitDialogCloseBtn" type="button" command="close" commandfor="submitToolDialog" aria-label="关闭提交弹窗">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <path d="M18 6 6 18M6 6l12 12"/>
          </svg>
        </button>
      </div>

      <form class="submit-form" id="submitToolForm" aria-labelledby="submitDialogTitle" novalidate>
        <div class="form-field">
          <label for="subToolName">工具名称 <span class="req-mark" aria-hidden="true">*</span></label>
          <input id="subToolName" name="name" type="text" maxlength="60" enterkeyhint="next" required autofocus placeholder="例如：DeepSeek / 秘塔 AI 搜索">
        </div>

        <div class="form-field">
          <label for="subToolUrl">官网链接 <span class="req-mark" aria-hidden="true">*</span></label>
          <input id="subToolUrl" name="url" type="url" inputmode="url" autocorrect="off" autocapitalize="none" spellcheck="false" enterkeyhint="next" required placeholder="https://example.com">
        </div>

        <div class="form-field">
          <label for="subToolCat">推荐分类</label>
          <select id="subToolCat" name="category">
            <option value="对话写作">对话写作</option>
            <option value="编程开发">编程开发</option>
            <option value="图像设计">图像设计</option>
            <option value="视频音频">视频音频</option>
            <option value="办公效率">办公效率</option>
            <option value="Agent与自动化">Agent与自动化</option>
            <option value="学习知识库">学习知识库</option>
            <option value="影音娱乐">影音娱乐</option>
            <option value="新品速递">新品速递</option>
            <option value="其他工具">其他工具</option>
          </select>
        </div>

        <div class="form-field">
          <label for="subToolDesc">核心亮点简介 <span class="req-mark" aria-hidden="true">*</span></label>
          <textarea id="subToolDesc" name="description" rows="3" maxlength="240" required placeholder="简述核心功能、适用人群与免费额度（200 字以内）"></textarea>
        </div>

        <p class="submit-form__error" id="subFormError" role="status" aria-live="polite"></p>

        <pre class="sr-only"><code id="subMarkdownSnippet"></code></pre>

        <div class="tool-dialog__actions submit-form__actions">
          <button class="btn-primary" type="submit">
            通过 GitHub Issue 提交收录
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M7 17 17 7M7 7h10v10"/>
            </svg>
          </button>
          <span class="copy-wrap">
            <button class="btn-secondary copy-button" id="subCopyBtn" type="button" command="--copy" commandfor="subMarkdownSnippet">复制收录信息</button>
            <span class="copy-tip" id="subCopyTip" role="status"></span>
          </span>
          <button class="btn-secondary" id="subMailBtn" type="button">邮件直投站长</button>
        </div>
      </form>
    </div>
  </dialog>

  <div class="toast-region" aria-live="polite" aria-atomic="true">
    <div class="toast" id="toast" hidden></div>
  </div>
</body>
</html>
