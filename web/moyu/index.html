<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <script>
    try {
      var savedScheme = localStorage.getItem("color-scheme");
      var validScheme = savedScheme === "light" || savedScheme === "dark" ? savedScheme : "light dark";
      document.querySelector('meta[name="color-scheme"]').content = validScheme;
    } catch (e) {}
  </script>
  <title>摸鱼热榜 · AI 导航聚合站</title>
  <meta name="description" content="聚合全网 B 站、微博、知乎、抖音、百度、36氪、少数派、掘金、CSDN 等 14 大平台实时热榜及休闲摸鱼导航。">
  <link rel="icon" type="image/png" sizes="64x64" href="../favicon.png?v=4">
  <link rel="apple-touch-icon" sizes="180x180" href="../apple-touch-icon.png?v=4">
  <link rel="stylesheet" href="../styles.css?v=9">
  <link rel="stylesheet" href="./moyu.css?v=1">
  <script type="module" src="./moyu.js?v=1"></script>
</head>
<body>
  <header class="top-bar site-header" id="topBar">
    <div class="top-bar__inner">
      <div class="top-bar__left">
        <a class="brand" href="../" aria-label="AI 导航聚合站首页">
          <img class="brand__icon" src="../logo.jpg?v=4" alt="" width="28" height="28">
          <span class="brand__name">AI 导航聚合站</span>
        </a>
      </div>

      <div class="top-bar__actions">
        <nav class="site-nav" aria-label="主导航">
          <button
            class="menu-button"
            type="button"
            popovertarget="site-menu"
            popovertargetaction="toggle"
            aria-controls="site-menu"
          >
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
              <path d="M4 7h16M4 12h16M4 17h16"/>
            </svg>
            <span>频道</span>
          </button>
          <ul id="site-menu" class="site-menu" popover="auto">
            <li><a href="../">首页</a></li>
            <li><a href="../ai/">AI</a></li>
            <li><a href="../tools/">工具</a></li>
            <li><a href="./" aria-current="page">摸鱼</a></li>
          </ul>
        </nav>

        <button class="theme-toggle" id="themeToggle" type="button" aria-label="切换浅色或深色外观" title="切换外观（可收回至跟随系统）">
          <span class="theme-toggle__icon theme-toggle__icon--sun" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="4"/>
              <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
            </svg>
          </span>
          <span class="theme-toggle__icon theme-toggle__icon--moon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>
            </svg>
          </span>
          <span class="sr-only" id="themeToggleLabel">切换外观</span>
        </button>
      </div>
    </div>
  </header>

  <main class="moyu-shell">
    <section class="moyu-hero">
      <div>
        <h1 class="moyu-hero__title">全网实时摸鱼热榜</h1>
        <p class="moyu-hero__sub" id="hotlistMeta">每小时自动更新 · 正在加载全网榜单…</p>
      </div>
      <div class="moyu-hero__controls">
        <input id="hotSearch" class="moyu-search" type="search" placeholder="跨平台搜索热榜标题…" aria-label="跨平台搜索热榜">
        <button id="refreshHotBtn" class="btn-secondary moyu-refresh-btn" type="button">刷新热榜</button>
      </div>
    </section>

    <div class="hot-groups" id="hotGroups" role="tablist" aria-label="热榜平台分组">
      <button type="button" class="cat-pill is-active" data-group="all">全部平台</button>
      <button type="button" class="cat-pill" data-group="tech">科技开发</button>
      <button type="button" class="cat-pill" data-group="social">综合热搜</button>
      <button type="button" class="cat-pill" data-group="media">影音社区</button>
    </div>

    <section class="hot-grid" id="hotGrid" aria-label="热榜卡片"></section>

    <section class="leisure-section" aria-labelledby="leisureHeading">
      <div class="leisure-head">
        <h2 class="leisure-head__title" id="leisureHeading">划水摸鱼 &amp; 影音游戏精选</h2>
        <span class="leisure-head__count" id="leisureCount"></span>
      </div>
      <div class="leisure-grid" id="leisureGrid"></div>
    </section>
  </main>

  <div class="toast-region" aria-live="polite" aria-atomic="true">
    <div class="toast" id="toast" hidden></div>
  </div>
</body>
</html>
